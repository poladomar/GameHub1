<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameHub</title><style>body{margin:0;background:#0e1220;color:#e8edff;font:16px system-ui}main{max-width:1050px;margin:auto;padding:32px}header{display:flex;justify-content:space-between;align-items:center}h1{color:#a78bfa}section{background:#1b2236;border-radius:18px;padding:24px;margin:20px 0}input,button{padding:12px;border-radius:8px;border:1px solid #475569;font:inherit;margin:4px}input{background:#101728;color:white;max-width:90%}button{background:#a78bfa;color:#111827;cursor:pointer}#games{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}article{background:#25314f;padding:24px;border-radius:14px}small{color:#c4b5fd}#message{min-height:24px}</style><main><header><h1>GameHub</h1><button id="logout">Sign out</button></header><section><h2>Find your next game.</h2><p>Discover the catalogue and build your demo library. No real payments.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="login">Sign in</button><button id="register">Register</button><div id="message" role="status"></div></section><section><input id="search" placeholder="Search games or genres"><button id="catalogue">Catalogue</button><button id="library">My library</button><div id="games"></div></section></main><script src="app.js"></script></html>
